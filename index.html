<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>疲勞駕駛監測系統</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', '微軟正黑體', Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 30px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px #bbb;
      padding: 24px 18px 32px 18px;
    }
    h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #333;
      letter-spacing: 2px;
    }
    .data-block {
      background: #f8f9fb;
      border-radius: 12px;
      box-shadow: 0 2px 8px #e0e0e0;
      padding: 18px 14px 18px 14px;
      margin-bottom: 22px;
      position: relative;
    }
    .label {
      font-weight: bold;
      font-size: 1.08em;
      color: #444;
      margin-right: 2px;
    }
    .value {
      font-size: 1.25em;
      color: #222;
      margin-left: 6px;
      font-weight: 500;
    }
    .status-light {
      display:inline-block;
      width:18px;
      height:18px;
      border-radius:50%;
      background:#ccc;
      border:2px solid #bbb;
      vertical-align:middle;
      margin-right:4px;
      box-shadow:0 0 4px #bbb;
      transition:background 0.2s;
    }
    .status-light.green { background:#4caf50; box-shadow:0 0 8px #4caf50; }
    .status-light.red { background:#f44336; box-shadow:0 0 8px #f44336; }
    .status-light.yellow { background:#ffeb3b; box-shadow:0 0 8px #ffeb3b; }
    .status-light.blink { animation: blink-red 0.7s infinite; }
    @keyframes blink-red {
      0%, 100% { background:#f44336; }
      50% { background:#fff; }
    }
    .status-text { font-size:0.95em; color:#888; margin-left:2px;}
    .chart-block { margin-top:8px;}
    canvas { background:#fafafa; border-radius:6px; }
    #img-modal {
      display:none;
      position:fixed;
      top:0; left:0;
      width:100vw; height:100vh;
      background:rgba(0,0,0,0.7);
      z-index:999;
      align-items:center;
      justify-content:center;
    }
    #img-modal.active { display:flex; }
    #modal-img {
      max-width:80vw;
      max-height:80vh;
      border-radius:12px;
      box-shadow:0 0 20px #333;
      background:#fff;
    }
    .img-modal-close {
      position:absolute;
      top:24px; right:36px;
      color:#fff;
      font-size:2em;
      cursor:pointer;
      z-index:1000;
      font-weight:bold;
      text-shadow:0 0 8px #222;
    }
    .error {
      color: #f44336;
      font-weight: bold;
      margin-top: 10px;
      text-align: center;
    }
    .video-ctrl {
      margin-top:10px;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    @media (max-width: 700px) {
      .container { max-width: 98vw; padding: 8px 2vw 18px 2vw;}
      .data-block { padding: 12px 6px 14px 6px;}
      canvas { width:90px !important; height:32px !important;}
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>疲勞駕駛監測系統</h2>
    <div id="fatigue-block" class="data-block">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="label">疲勞指數：</span>
        <span id="fatigue-status" class="status-light yellow"></span>
        <span id="fatigue-status-text" class="status-text">待確認</span>
      </div>
      <span id="fatigue" class="value">載入中...</span>
      <div class="chart-block">
        <canvas id="fatigue-chart" width="120" height="40"></canvas>
      </div>
    </div>
    <div id="heart-rate-block" class="data-block">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="label">心率：</span>
        <span id="heart-status" class="status-light yellow"></span>
        <span id="heart-status-text" class="status-text">待確認</span>
      </div>
      <span id="heart_rate" class="value">載入中...</span>
      <div class="chart-block">
        <canvas id="heart-chart" width="120" height="40"></canvas>
      </div>
    </div>
    <div id="alcohol-level-block" class="data-block">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="label">酒精濃度：</span>
        <span id="alcohol-status" class="status-light yellow"></span>
        <span id="alcohol-status-text" class="status-text">待確認</span>
      </div>
      <span id="alcohol_level" class="value">載入中...</span>
      <div class="chart-block">
        <canvas id="alcohol-chart" width="120" height="40"></canvas>
      </div>
    </div>
    <div id="video-block" class="data-block">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="label">即時影像：</span>
      </div>
      <img id="video-img" src="" alt="即時影像" style="margin-top:10px;width:120px;height:90px;border-radius:8px;background:#eee;cursor:pointer;object-fit:cover;border:1px solid #ddd;">
      <div class="video-ctrl">
        <label for="img-interval">刷新間隔(毫秒)：</label>
        <input type="number" id="img-interval" value="1000" min="500" max="5000" step="100">
        <button id="pause-img">暫停</button>
        <button id="resume-img">恢復</button>
      </div>
    </div>
    <div id="error-message" class="error"></div>
  </div>
  <!-- 圖片放大彈窗 -->
  <div id="img-modal">
    <span class="img-modal-close" id="img-modal-close">&times;</span>
    <img id="modal-img" src="">
  </div>
  <script>
    // WebSocket 連線
    const socket = io('https://fatigue-m68t.onrender.com', {
      transports: ['websocket']
    });

    // 狀態燈判斷
    function setStatusLight(id, status) {
      const light = document.getElementById(id + '-status');
      const text = document.getElementById(id + '-status-text');
      light.classList.remove('green', 'red', 'yellow', 'blink');
      if (status === 'green') {
        light.classList.add('green');
        text.innerText = '正常';
      } else if (status === 'red') {
        light.classList.add('red', 'blink'); // 紅燈閃爍
        text.innerText = '異常';
      } else {
        light.classList.add('yellow');
        text.innerText = '待確認';
      }
    }
    // 即時狀態圖（canvas折線圖）
    function drawChart(canvasId, dataArr, color) {
      const canvas = document.getElementById(canvasId);
      if (!canvas || !dataArr || dataArr.length < 2) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      // 根據不同感測資料設定上下限
      let min = 0, max = 100;
      if(canvasId === 'fatigue-chart') { min = 0; max = 1; }
      if(canvasId === 'alcohol-chart') { min = 0; max = 0.5; }
      if(canvasId === 'heart-chart') { min = 40; max = 120; }
      const step = canvas.width / (dataArr.length-1);
      for(let i=0;i<dataArr.length;i++){
        // 超出範圍自動裁切
        let val = Math.max(min, Math.min(max, dataArr[i]));
        // 疲勞指數為負值，需反向計算
        let y;
        if(canvasId === 'fatigue-chart'){
          y = canvas.height - ((val - min) / (max - min)) * canvas.height;
        }else{
          y = canvas.height - ((val - min) / (max - min)) * canvas.height;
        }
        if(i===0) ctx.moveTo(x = i*step, y);
        else ctx.lineTo(x = i*step, y);
      }
      ctx.stroke();
    }
    // 初始假資料（全部為0，代表最低點）
    let fatigueHistory = Array(20).fill(0);
    let heartHistory = Array(20).fill(0);
    let alcoholHistory = Array(20).fill(0);
    drawChart('fatigue-chart', fatigueHistory, '#f44336');
    drawChart('heart-chart', heartHistory, '#4caf50');
    drawChart('alcohol-chart', alcoholHistory, '#2196f3');

    // 感測資料更新
    socket.on('dataClass_update', function(data) {
      if (!data || !data.success || !data.data) {
        document.getElementById('error-message').innerText = '❌ 感測資料取得失敗';
        document.getElementById('fatigue').innerText = '-';
        document.getElementById('heart_rate').innerText = '-';
        document.getElementById('alcohol_level').innerText = '-';
        setStatusLight('fatigue', 'yellow');
        setStatusLight('heart', 'yellow');
        setStatusLight('alcohol', 'yellow');
        return;
      }
      document.getElementById('error-message').innerText = '';
      var sensor_data = data.data;
      // 疲勞
      if (sensor_data.fatigue) {
        setStatusLight('fatigue', sensor_data.fatigue.is_fatigued === false ? 'green' : (sensor_data.fatigue.is_fatigued === true ? 'red' : 'yellow'));
        // 分數顯示小數點2位
        let fatigueScore = typeof sensor_data.fatigue.fatigue_score === 'number'
          ? sensor_data.fatigue.fatigue_score
          : 0;
        document.getElementById('fatigue').innerText = (fatigueScore.toFixed(2)) + ' 分';
        fatigueHistory.push(Number(fatigueScore) || 0);
        if(fatigueHistory.length>20) fatigueHistory.shift();
        drawChart('fatigue-chart', fatigueHistory, '#f44336');
      } else {
        setStatusLight('fatigue', 'yellow');
        document.getElementById('fatigue').innerText = '無資料';
      }
      // 心率
      if (sensor_data.heart) {
        setStatusLight('heart', sensor_data.heart.is_heart_rate_normal === false ? 'green' : (sensor_data.heart.is_heart_rate_normal === true ? 'red' : 'yellow'));
        let heartValue = typeof sensor_data.heart.bpm_average === 'number'
          ? sensor_data.heart.bpm_average
          : 0;
        document.getElementById('heart_rate').innerText = (heartValue ?? '-') + ' 次/分';
        heartHistory.push(heartValue);
        if(heartHistory.length>20) heartHistory.shift();
        drawChart('heart-chart', heartHistory, '#4caf50');
      } else {
        setStatusLight('heart', 'yellow');
        document.getElementById('heart_rate').innerText = '無資料';
      }
      // 酒精
      if (sensor_data.alcohol) {
        setStatusLight('alcohol', sensor_data.alcohol.is_over_limit === false ? 'green' : (sensor_data.alcohol.is_over_limit === true ? 'red' : 'yellow'));
        let alcoholValue = typeof sensor_data.alcohol.alcohol_value === 'number'
          ? sensor_data.alcohol.alcohol_value
          : 0;
        document.getElementById('alcohol_level').innerText = (alcoholValue ?? '-') + ' 度';
        alcoholHistory.push(alcoholValue);
        if(alcoholHistory.length>20) alcoholHistory.shift();
        drawChart('alcohol-chart', alcoholHistory, '#2196f3');
      } else {
        setStatusLight('alcohol', 'yellow');
        document.getElementById('alcohol_level').innerText = '無資料';
      }
    });

    // 影像更新
    let paused = false;
    let latestImageBase64 = '';
    socket.on('image_update', function(data) {
      if (paused) return;
      if (data && data.image) {
        latestImageBase64 = data.image;
        document.getElementById('video-img').src = 'data:image/jpeg;base64,' + latestImageBase64;
        document.getElementById('video-img').alt = '';
      } else {
        document.getElementById('video-img').alt = '無影像';
      }
    });

    // 支持自動刷新（如需定時刷新而非僅依 WebSocket 推送）
    let imgTimer = null;
    let imgInterval = 1000;
    function startImgPolling() {
      if (imgTimer) clearInterval(imgTimer);
      imgTimer = setInterval(function() {
        if (!paused && latestImageBase64) {
          document.getElementById('video-img').src = 'data:image/jpeg;base64,' + latestImageBase64;
        }
      }, imgInterval);
    }
    document.getElementById('img-interval').addEventListener('change', function() {
      imgInterval = parseInt(this.value);
      startImgPolling();
    });

    document.getElementById('pause-img').addEventListener('click', function() {
      paused = true;
    });

    document.getElementById('resume-img').addEventListener('click', function() {
      paused = false;
      if (latestImageBase64) {
        document.getElementById('video-img').src = 'data:image/jpeg;base64,' + latestImageBase64;
      }
    });

    startImgPolling();

    // 連線錯誤提示
    socket.on('connect_error', function(err) {
      document.getElementById('error-message').innerText = '❌ WebSocket 連線失敗：' + err.message;
    });
    socket.on('disconnect', function() {
      document.getElementById('error-message').innerText = '❌ WebSocket 已斷線';
    });

    // 圖片放大功能
    ['video-img'].forEach(function(id){
      document.getElementById(id).onclick = function(){
        const src = this.src;
        if(src){
          document.getElementById('modal-img').src = src;
          document.getElementById('img-modal').classList.add('active');
        }
      };
    });
  </script>
</body>
</html>
